# 多模型智能编排网关 - 生产部署编排
# 使用方式: cp .env.example .env && docker compose up -d

version: "3.9"

services:
  gateway:
    build: .
    image: modelhub
    container_name: modelhub
    # host 网络：共享宿主网络栈（可直接访问宿主 127.0.0.1:7897 代理；8000 直接监听宿主，无需 ports 映射）
    network_mode: host
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/gateway.db
      # UPSTREAM_PROXY 不要写死在这里（各机器代理端口不同）——在 .env 中配置，
      # 经 env_file 自动注入；境外供应商(Grok/OpenAI/Claude/Gemini)需代理时设为
      # 如 http://127.0.0.1:7897，留空则全部直连。境内供应商由代理分流规则直连。
    volumes:
      - gateway-data:/data
    restart: unless-stopped

  # PostgreSQL（生产环境推荐）
  # 启用后修改 .env: DATABASE_URL=postgresql+asyncpg://gateway:secret@db:5432/gateway
  db:
    image: crpi-27zlqugq2208c0pz.cn-hangzhou.personal.cr.aliyuncs.com/xiaofeiyang930112/postgres:16-alpine
    container_name: gateway-db
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gateway
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles: ["full"]

  # Redis 缓存（生产环境推荐）
  redis:
    image: crpi-27zlqugq2208c0pz.cn-hangzhou.personal.cr.aliyuncs.com/xiaofeiyang930112/redis:7-alpine
    container_name: gateway-redis
    restart: unless-stopped
    profiles: ["full"]

volumes:
  gateway-data:
  db-data:
